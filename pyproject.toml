[project]
name = "deforest-mt"
version = "0.1.0"
description = "Bitemporal Sentinel-1/2 fusion + Random Forest for deforestation detection in NW Mato Grosso, with Hamunyela spatial normalisation and comparison against DETER alerts."
authors = [{name = "Jose Pablo Perez Cicilia"}]
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
